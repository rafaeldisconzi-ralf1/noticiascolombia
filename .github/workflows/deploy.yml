name: Deploy FTP

on:
  push:
    branches: [claude/epic-hopper-5v5m65]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y -qq lftp > /dev/null

      # O login FTP já entra dentro de public_html, então o site vai na raiz do FTP.
      - name: Subir para a raiz do site
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow no; set net:max-retries 5; set net:reconnect-interval-base 5; set ftp:passive-mode on;
            open -u u937190574.noticiasdelpais.online,$FTP_PASSWORD 185.173.111.186;
            mirror -R --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore ./ ./;
            rm -rf public_html;
            rm -rf .git;
            echo '--- raiz do FTP ---'; cls -la"
